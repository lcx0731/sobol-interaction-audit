[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sobol-interaction-audit"
version = "0.1.0"
description = "Pick-freeze sensitivity estimates checked against exact polynomial ANOVA and independent randomized replicates"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "scipy==1.15.3"]
license = "MIT"

[project.scripts]
sobol-audit = "interaction_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
