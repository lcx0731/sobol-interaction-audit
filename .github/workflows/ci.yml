name: tests-and-example

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies and package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps .
          python -m pip check
      - name: Test exact references and sampling logic
        run: python -m pytest -q
      - name: Reproduce complete experiment
        run: python examples/demo.py --output /tmp/sobol-interaction-results
      - name: Exercise installed CLI
        run: sobol-audit --power 7 --repetitions 4 --scheme iid --normalization pooled
